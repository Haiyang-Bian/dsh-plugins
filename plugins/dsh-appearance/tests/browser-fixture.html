<html lang="zh-CN"><meta charset="utf-8"><title>DSH 主题与设置验证</title>

<style>
body{margin:0;background:var(--dsw-alias-bg-layer-1);color:var(--dsw-alias-label-primary)}
main{max-width:1180px;padding:24px;margin:auto}.columns{display:grid;grid-template-columns:minmax(320px, .8fr) minmax(0,1.2fr);gap:24px;margin-top:20px}.settings-shell{background:var(--dsw-alias-bg-layer-2);padding:20px;border-radius:16px}.host-preview{height:574px;grid-template-columns:164px minmax(0,1fr);border:1px solid var(--dsw-alias-border-l3);border-radius:16px}.preview-sidebar{padding:20px 12px;gap:16px}.preview-sidebar p{margin:0}.preview-session{padding:24px;min-height:0;flex:1;box-sizing:border-box}.preview-session h2{font-size:20px}.preview-session p{line-height:1.8}.preview-composer{margin-top:auto;padding:14px}.preview-composer textarea{box-sizing:border-box;width:100%;font:inherit;resize:none;background:transparent;color:inherit;border:0;outline:none}.brand{font-family:var(--dsw-font-family-brand)}.note{font-size:12px;opacity:.7}.pass{color:#359563}#error{white-space:pre-wrap;color:#b84646}button{font-family:inherit}li{margin:6px 0}.checks{margin-top:20px}@media(max-width:900px){.columns{grid-template-columns:1fr}.host-preview{height:520px}}

    <button class="_2H3hWW_newSession" id="button">＋ 新建对话</button>
    <p class="note">工作区</p><button class="_2H3hWW_panelRow">主题设计</button><button class="_2H3hWW_panelRow">开发笔记</button>

  <div class="BynINW_centerCol"><div class="Dc7zOa_root" id="conversation-root">
